<!DOCTYPE html>
<!-- ========================================================
  PROJECT: Lilith Defense 1-1
  VERSION: v1.2.1-trajectory-scale-fix
  DATE: 2026-10-07
  CHANGES:
    - Fixed arrow trajectories shooting into outer sky
    - Scaled up characters & barricades by 1.6x for clear visibility
    - Re-anchored archer firing origins
======================================================== -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lilith Defense 1-1 (v1.2.1)</title>
  <style>
    :root{--gold:#b88432;--ink:#251b13}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1822;font-family:"Segoe UI",Arial,sans-serif;touch-action:none;color:var(--ink)}
    #root{position:fixed;inset:0;background:#0d1822}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    #hud{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:18px;background:linear-gradient(180deg,rgba(255,238,198,.98),rgba(235,197,121,.96));border:2px solid var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.30);font-size:clamp(13px,1.55vw,20px);font-weight:900;white-space:nowrap}
    .timer{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ffcf4a var(--timeDeg),#5c4128 0);box-shadow:inset 0 0 0 5px #2d1f17;color:#fff3c6;font-size:15px}
    .hudMain{display:grid;grid-template-columns:repeat(5,auto);gap:7px;align-items:center}
    .pill{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:11px;background:rgba(255,255,255,.36)}
    .barMini{width:80px;height:12px;border-radius:8px;background:#402b1b;overflow:hidden}
    .barMini i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#49c773,#f1d45b)}
    .stat{display:grid;grid-template-columns:auto auto;gap:2px 6px;align-items:center;padding:4px 8px;border-radius:11px;background:rgba(255,255,255,.36)}
    .stat strong{font-size:16px;line-height:.92;color:#21150f}
    .stat small{font-size:9px;color:#795126;display:block}
    #dock{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;width:min(520px,70vw);height:66px;border-radius:18px;background:linear-gradient(180deg,#473828,#2c2118);border:3px solid #b9934a;box-shadow:0 -8px 24px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}
    #dock button{position:relative;border:0;border-radius:15px;background:linear-gradient(180deg,#a98552,#7b5b37);display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;cursor:pointer;color:#fff2d4;font-weight:800;font-size:11px}
    #dock button.active{outline:3px solid #fff28f;filter:brightness(1.15);transform:translateY(-2px)}
    .count{position:absolute;right:4px;top:4px;min-width:18px;height:15px;border-radius:8px;background:#1e1b17;color:#ffe9b5;font-size:10px;display:grid;place-items:center}
    #versionBadge{position:absolute;right:12px;bottom:8px;z-index:5;color:rgba(255,255,255,0.45);font-size:11px;font-family:monospace;pointer-events:none}
    #waveMsg{position:absolute;left:50%;top:85px;transform:translateX(-50%);z-index:6;padding:8px 20px;border-radius:16px;background:rgba(185,28,28,.9);color:#fff;border:2px solid #fca5a5;font-size:18px;font-weight:900;opacity:0;pointer-events:none}
    #waveMsg.show{opacity:1}
    #story{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:9;width:min(500px,76vw);border-radius:22px;background:linear-gradient(180deg,#fff2d1,#e5bb70);border:2px solid var(--gold);box-shadow:0 18px 42px rgba(0,0,0,.5);padding:24px;text-align:center}
    #story h2{margin:0 0 10px;font-size:26px}
    #story button{margin-top:14px;width:100%;height:46px;border-radius:12px;background:linear-gradient(180deg,#a56f36,#7d5228);color:#ffe9b5;font-size:18px;font-weight:800;border:0;cursor:pointer}
    #story.hide{display:none}
    #result{position:absolute;inset:0;z-index:10;display:none;place-items:center;background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
    #result.show{display:grid}
    .resCard{width:min(500px,80vw);border-radius:22px;padding:22px;background:linear-gradient(180deg,#fff4cd,#dead59);border:3px solid var(--gold);text-align:center;font-weight:900}
    .resCard button{margin-top:14px;height:42px;width:140px;color:#fff;font-size:16px;font-weight:800;border-radius:10px;background:#854d0e;border:0;cursor:pointer}
  </style>
</head>
<body>
<div id="root">
  <canvas id="game"></canvas>
  <div id="hud" style="--timeDeg: 360deg;">
    <div class="timer" id="timerBox">03:00</div>
    <div class="hudMain">
      <span class="pill">🚪<span class="barMini"><i id="gateBar" style="width:100%"></i></span><b id="gateTxt">100%</b></span>
      <span class="stat"><b>🚩</b><strong><span id="waveTxt">0</span>/15<small>WAVE</small></strong></span>
      <span class="stat"><b>⚔</b><strong><span id="killTxt">0</span><small>KILLS</small></strong></span>
      <span class="stat"><b>👹</b><strong><span id="foeTxt">0</span><small>SWARM</small></strong></span>
      <span class="stat"><b>🛡</b><strong><span id="guardTxt">4</span><small>HEROES</small></strong></span>
    </div>
  </div>
  <div id="waveMsg"></div>
  <div id="versionBadge">Build: v1.2.1</div>
  <div id="dock">
    <button data-action="CallGuard"><span>🛡</span>Guard<span class="count" id="cGuard">x5</span></button>
    <button data-action="CallArcher"><span>🏹</span>Archer<span class="count" id="cArcher">x5</span></button>
    <button data-action="Oil"><span>🔥</span>Flame<span class="count" id="cOil">x6</span></button>
    <button data-action="Barricade"><span>🪵</span>Spike<span class="count" id="cBarricade">x6</span></button>
  </div>
  <div id="story">
    <h2>Lilith Defense 1-1</h2>
    <p>Hold the gate against the raiding warbands! Maintain defensive formation at the crossroads.</p>
    <button id="startBtn">Begin Defense</button>
  </div>
  <div id="result"></div>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const canvas = $("game"), ctx = canvas.getContext("2d");
  const waveMsg = $("waveMsg"), story = $("story"), startBtn = $("startBtn"), result = $("result");

  /* ==================== 原版音效系统 ==================== */
  let audioCtx = null;
  const lastSfx = {};
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function tone(f, d = 0.12, type = "sine", vol = 0.05, at = 0) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + at, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f * 0.5), t + d);
    g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + d + 0.02);
  }
  function noise(d = 0.1, vol = 0.05, freq = 800) {
    if (!audioCtx) return;
    const rate = audioCtx.sampleRate, buf = audioCtx.createBuffer(1, Math.max(1, rate * d), rate), data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 0.3);
    const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start();
  }
  function playSfx(k) {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (lastSfx[k] && now - lastSfx[k] < 0.06) return;
    lastSfx[k] = now;
    if (k === "bow") { tone(320, 0.06, "triangle", 0.04); noise(0.04, 0.02, 900); }
    else if (k === "hit") { noise(0.06, 0.05, 450); tone(110, 0.06, "triangle", 0.03); }
    else if (k === "heavy") { noise(0.12, 0.08, 220); tone(60, 0.14, "sine", 0.06); }
    else if (k === "flame") { tone(500, 0.22, "triangle", 0.04); noise(0.28, 0.08, 750); tone(85, 0.45, "sine", 0.06, 0.08); }
    else if (k === "gateHit") { noise(0.09, 0.07, 180); tone(65, 0.16, "sine", 0.05); }
    else if (k === "victory") { tone(392, 0.18, "triangle", 0.05, 0); tone(523, 0.2, "triangle", 0.05, 0.14); tone(659, 0.3, "triangle", 0.06, 0.3); }
    else if (k === "defeat") { tone(160, 0.28, "triangle", 0.05, 0); tone(110, 0.4, "sine", 0.05, 0.16); }
  }

  /* ==================== 资源系统 ==================== */
  const ASSETS = {
    bg: { img: new Image(), ready: false },
    guard: { img: new Image(), ready: false },
    archer: { img: new Image(), ready: false },
    grunt: { img: new Image(), ready: false },
    brute: { img: new Image(), ready: false },
    barricade: { img: new Image(), ready: false }
  };

  ASSETS.bg.img.onload = () => { ASSETS.bg.ready = true; };
  ASSETS.bg.img.src = "assets/stage_real_25d_battlefield_right_gate_v39_full_rebuild.png";

  function registerAsset(key, paths) {
    const item = ASSETS[key];
    let pIdx = 0;
    function tryNext() {
      if (pIdx >= paths.length) return;
      item.img.onload = () => { item.ready = true; };
      item.img.onerror = () => { tryNext(); };
      item.img.src = paths[pIdx++];
    }
    tryNext();
  }
  registerAsset("guard", ["assets/animations/guard_actions.png", "assets/guard_actions.png", "assets/guard_anim.png"]);
  registerAsset("archer", ["assets/animations/archer_actions.png", "assets/archer_actions.png"]);
  registerAsset("grunt", ["assets/animations/grunt_actions.png", "assets/grunt_actions.png"]);
  registerAsset("brute", ["assets/animations/brute_actions.png", "assets/brute_actions.png"]);
  registerAsset("barricade", ["assets/barricade.png", "assets/animations/barricade.png", "assets/props/barricade.png"]);

  /* ==================== 真实路径坐标 ==================== */
  const gateLoc = { x: 80, z: 42 };
  const paths = [
    [{x: 1, z: 22}, {x: 14, z: 28}, {x: 28, z: 37}, {x: 42, z: 42}, {x: 58, z: 40}, {x: 70, z: 44}, {x: 80, z: 42}],
    [{x: 1, z: 48}, {x: 16, z: 50}, {x: 33, z: 48}, {x: 48, z: 46}, {x: 62, z: 46}, {x: 72, z: 44}, {x: 80, z: 42}],
    [{x: 18, z: 88}, {x: 32, z: 74}, {x: 44, z: 63}, {x: 56, z: 56}, {x: 68, z: 50}, {x: 76, z: 44}, {x: 80, z: 42}]
  ];

  const S = {
    time: 0, duration: 180, gateHp: 4000, gateMax: 4000, kills: 0, wave: 0, totalWaves: 15,
    started: false, gameOver: false, shake: 0, pending: null, spawnCd: 1.0,
    items: { CallGuard: 5, CallArcher: 5, Oil: 6, Barricade: 6 }
  };

  const soldiers = [], enemies = [], blocks = [], oils = [], shots = [], particles = [], texts = [];

  let view = { w: 1, h: 1, scale: 8 };
  function resize() {
    const dpr = Math.min(1.5, devicePixelRatio || 1);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    view.w = innerWidth; view.h = innerHeight;
    view.scale = Math.max(3.8, Math.min(innerWidth / 200, innerHeight / 110));
  }
  function w2s(x, z) { return { x: view.w * (x / 100), y: view.h * (z / 100) }; }
  function s2w(x, y) { return { x: Math.max(0, Math.min(100, x / view.w * 100)), z: Math.max(0, Math.min(100, y / view.h * 100)) }; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }

  /* ==================== 守军站位（修正弹道与高度） ==================== */
  function spawnSoldier(type) {
    const isGuard = type === "Guard";
    soldiers.push({
      type,
      // 盾卫守在三岔路前，弓箭手紧贴大门两侧地面站立，弹道不再飞天
      x: isGuard ? (66 + Math.random() * 5) : (Math.random() < 0.5 ? 75 : 81),
      z: isGuard ? (42 + Math.random() * 6) : (35 + Math.random() * 5),
      hp: isGuard ? 850 : 350, maxHp: isGuard ? 850 : 350,
      range: isGuard ? 10 : 70, dmg: isGuard ? 45 : 36,
      cdMax: isGuard ? 0.6 : 0.9, cd: 0,
      animTime: Math.random() * 6, action: "idle"
    });
  }

  function spawnWaveEnemies(count) {
    for (let i = 0; i < count; i++) {
      const rid = i % paths.length;
      const r = paths[rid];
      enemies.push({
        type: (Math.random() < 0.25 && S.wave >= 3) ? "brute" : "grunt",
        r, rid, seg: 0, progress: -(i * 2.5),
        x: r[0].x, z: r[0].z + (Math.random() - 0.5) * 2,
        hp: 200, maxHp: 200,
        spd: 4.8 + Math.random() * 0.8,
        dmg: 8, cd: 0, dead: false,
        animTime: Math.random() * 6, action: "walk"
      });
    }
  }

  for (let i = 0; i < 3; i++) spawnSoldier("Guard");
  for (let i = 0; i < 3; i++) spawnSoldier("Archer");

  startBtn.onclick = () => {
    initAudio();
    S.started = true;
    story.classList.add("hide");
    triggerWave();
  };

  function triggerWave() {
    if (S.wave >= S.totalWaves) return;
    S.wave++;
    const waveCount = 10 + S.wave * 2;
    spawnWaveEnemies(waveCount);
    waveMsg.textContent = `🚨 Wave ${S.wave} Advancing! (${waveCount} Enemies)`;
    waveMsg.classList.add("show");
    setTimeout(() => waveMsg.classList.remove("show"), 2200);
    S.spawnCd = 13.0;
  }

  /* ==================== 技能释放 ==================== */
  $("dock").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    initAudio();
    const a = btn.dataset.action;
    if (S.items[a] <= 0) return;
    if (a === "CallGuard") { S.items.CallGuard--; spawnSoldier("Guard"); playSfx("hit"); updateUI(); return; }
    if (a === "CallArcher") { S.items.CallArcher--; spawnSoldier("Archer"); playSfx("bow"); updateUI(); return; }
    S.pending = a;
    document.querySelectorAll("#dock button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });

  canvas.addEventListener("pointerdown", e => {
    if (!S.pending) return;
    initAudio();
    const p = s2w(e.clientX, e.clientY);
    if (S.pending === "Oil") {
      S.items.Oil--;
      oils.push({ x: p.x, z: p.z, r: 20, life: 6.5, tick: 0.25, animTime: 0 });
      S.shake = 0.3;
      playSfx("flame");
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: p.x + (Math.random()-0.5)*15, z: p.z + (Math.random()-0.5)*8,
          vx: (Math.random()-0.5)*10, vz: -(Math.random()*15 + 8),
          life: 0.5, max: 0.5, color: Math.random() < 0.6 ? "#ea580c" : "#facc15"
        });
      }
    } else if (S.pending === "Barricade") {
      S.items.Barricade--;
      blocks.push({ x: p.x, z: p.z, hp: 800, maxHp: 800, life: 45 });
      playSfx("hit");
    }
    S.pending = null;
    document.querySelectorAll("#dock button").forEach(b => b.classList.remove("active"));
    updateUI();
  });

  /* ==================== 物理与战斗更新 ==================== */
  function update(dt) {
    if (!S.started || S.gameOver) return;
    S.time += dt;
    S.shake = Math.max(0, S.shake - dt);
    S.spawnCd -= dt;
    if (S.spawnCd <= 0) triggerWave();

    // 烈焰风暴
    for (let i = oils.length - 1; i >= 0; i--) {
      const o = oils[i];
      o.life -= dt; o.tick -= dt; o.animTime += dt * 8;
      if (Math.random() < 0.45) {
        particles.push({
          x: o.x + (Math.random()-0.5)*o.r*1.1,
          z: o.z + (Math.random()-0.5)*o.r*0.6,
          vx: (Math.random()-0.5)*6, vz: -(Math.random()*14 + 8),
          life: 0.4, max: 0.4, color: Math.random() < 0.5 ? "#f97316" : "#fbbf24"
        });
      }
      if (o.tick <= 0) {
        o.tick = 0.25;
        for (const en of enemies) {
          if (!en.dead && dist(en, o) <= o.r) {
            en.hp -= 42;
            texts.push({ x: en.x, z: en.z, txt: "-42", color: "#f97316", life: 0.35 });
          }
        }
      }
      if (o.life <= 0) oils.splice(i, 1);
    }

    // 怪物移动与攻击
    for (const en of enemies) {
      if (en.dead) continue;
      en.cd -= dt;

      let targetSol = null, minD = 999;
      for (const sol of soldiers) {
        const d = dist(en, sol);
        if (d < minD) { minD = d; targetSol = sol; }
      }
      if (targetSol && minD < 6.5) {
        en.action = "attack"; en.animTime += dt * 5;
        if (en.cd <= 0) {
          en.cd = 0.9; targetSol.hp -= en.dmg; playSfx("hit");
          texts.push({ x: targetSol.x, z: targetSol.z, txt: `-${en.dmg}`, color: "#f87171", life: 0.3 });
        }
        continue;
      }

      let targetBlk = null;
      for (const blk of blocks) {
        if (dist(en, blk) < 6.5) { targetBlk = blk; break; }
      }
      if (targetBlk) {
        en.action = "attack"; en.animTime += dt * 5;
        if (en.cd <= 0) {
          en.cd = 0.9; targetBlk.hp -= en.dmg * 2; playSfx("hit");
          if (targetBlk.hp <= 0) playSfx("heavy");
        }
        continue;
      }

      if (dist(en, gateLoc) < 7.5) {
        en.action = "attack"; en.animTime += dt * 5;
        if (en.cd <= 0) {
          en.cd = 1.0; S.gateHp -= en.dmg * 2; S.shake = 0.12; playSfx("gateHit");
        }
        continue;
      }

      en.action = "walk"; en.animTime += dt * 5;
      const r = en.r, p0 = r[en.seg], p1 = r[Math.min(r.length - 1, en.seg + 1)];
      const segLen = dist(p0, p1) || 1;
      en.progress += en.spd * dt;
      if (en.progress >= segLen && en.seg < r.length - 2) {
        en.progress = 0; en.seg++;
      }
      const t = Math.max(0, Math.min(1, en.progress / segLen));
      en.x = p0.x + (p1.x - p0.x) * t;
      en.z = p0.z + (p1.z - p0.z) * t;
    }

    // 守军与弓箭手
    for (const sol of soldiers) {
      sol.cd -= dt; sol.animTime += dt * 4;
      if (sol.type === "Guard") {
        let fighting = false;
        for (const en of enemies) {
          if (!en.dead && dist(sol, en) < sol.range) {
            fighting = true; sol.action = "attack";
            if (sol.cd <= 0) {
              sol.cd = sol.cdMax; en.hp -= sol.dmg; playSfx("hit");
              texts.push({ x: en.x, z: en.z, txt: `-${sol.dmg}`, color: "#38bdf8", life: 0.3 });
            }
            break;
          }
        }
        if (!fighting) sol.action = "idle";
      } else if (sol.type === "Archer") {
        let target = null, bestD = sol.range;
        for (const en of enemies) {
          if (en.dead) continue;
          const d = dist(sol, en);
          if (d < bestD) { bestD = d; target = en; }
        }
        if (target) {
          sol.action = "attack";
          if (sol.cd <= 0) {
            sol.cd = sol.cdMax;
            // 真实贴地弹道，不再飞天
            shots.push({ ax: sol.x, az: sol.z, bx: target.x, bz: target.z, life: 0.22, max: 0.22 });
            playSfx("bow");
            let pierce = 0;
            for (const en of enemies) {
              if (!en.dead && dist(en, target) < 10) {
                en.hp -= sol.dmg;
                texts.push({ x: en.x, z: en.z, txt: `-${sol.dmg}`, color: "#fde047", life: 0.3 });
                pierce++;
                if (pierce >= 3) break;
              }
            }
          }
        } else {
          sol.action = "idle";
        }
      }
    }

    // 死亡清理
    for (let i = enemies.length - 1; i >= 0; i--) {
      const en = enemies[i];
      if (en.hp <= 0) {
        S.kills++;
        for (let p = 0; p < 4; p++) {
          particles.push({ x: en.x, z: en.z, vx: (Math.random()-0.5)*18, vz: (Math.random()-0.5)*18, life: 0.35, max: 0.35, color: "#ef4444" });
        }
        enemies.splice(i, 1);
      }
    }
    for (let i = soldiers.length - 1; i >= 0; i--) if (soldiers[i].hp <= 0) soldiers.splice(i, 1);
    for (let i = blocks.length - 1; i >= 0; i--) if (blocks[i].hp <= 0) blocks.splice(i, 1);
    for (let i = shots.length - 1; i >= 0; i--) { shots[i].life -= dt; if (shots[i].life <= 0) shots.splice(i, 1); }
    for (let i = texts.length - 1; i >= 0; i--) { texts[i].life -= dt; if (texts[i].life <= 0) texts.splice(i, 1); }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt; p.x += p.vx * dt; p.z += p.vz * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (S.gateHp <= 0) endGame(false);
    if (S.time >= S.duration) endGame(true);
    updateUI();
  }

  function endGame(win) {
    S.gameOver = true;
    playSfx(win ? "victory" : "defeat");
    result.innerHTML = `<div class="resCard">
      <h2>${win ? "VICTORY!" : "DEFEAT"}</h2>
      <p style="font-size:20px;margin:8px 0">${win ? "The gate held strong against all assaults!" : "The wooden gate was breached!"}</p>
      <p>Kills: <b>${S.kills}</b> | Waves: <b>${S.wave}/15</b></p>
      <button onclick="location.reload()">Play Again</button>
    </div>`;
    result.classList.add("show");
  }

  function updateUI() {
    const left = Math.max(0, Math.floor(S.duration - S.time));
    $("timerBox").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    const gp = Math.max(0, Math.floor(S.gateHp / S.gateMax * 100));
    $("gateBar").style.width = gp + "%";
    $("gateTxt").textContent = gp + "%";
    $("waveTxt").textContent = S.wave;
    $("killTxt").textContent = S.kills;
    $("foeTxt").textContent = enemies.length;
    $("guardTxt").textContent = soldiers.length;

    $("cGuard").textContent = "x" + S.items.CallGuard;
    $("cArcher").textContent = "x" + S.items.CallArcher;
    $("cOil").textContent = "x" + S.items.Oil;
    $("cBarricade").textContent = "x" + S.items.Barricade;
  }

  /* ==================== 渲染器 (放大 1.6 倍，修正弹道) ==================== */
  function drawBarricadeProp(ctx, b) {
    const p = w2s(b.x, b.z);
    const asset = ASSETS.barricade;
    if (asset && asset.ready && asset.img.naturalWidth > 0) {
      const w = 48, h = 48 * (asset.img.naturalHeight / asset.img.naturalWidth);
      ctx.drawImage(asset.img, p.x - w / 2, p.y - h + 6, w, h);
    } else {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath(); ctx.ellipse(p.x, p.y + 4, 18, 6, 0, 0, Math.PI * 2); ctx.fill();

      // 重型削尖交叉木
      ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.strokeStyle = "#382211";
      ctx.beginPath(); ctx.moveTo(p.x - 14, p.y - 18); ctx.lineTo(p.x + 14, p.y + 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x + 14, p.y - 18); ctx.lineTo(p.x - 14, p.y + 2); ctx.stroke();
      ctx.strokeStyle = "#6f411e";
      ctx.beginPath(); ctx.moveTo(p.x - 13, p.y - 17); ctx.lineTo(p.x + 13, p.y + 1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x + 13, p.y - 17); ctx.lineTo(p.x - 13, p.y + 1); ctx.stroke();

      // 横木与铁钉
      ctx.strokeStyle = "#8b5327"; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(p.x - 17, p.y - 8); ctx.lineTo(p.x + 17, p.y - 8); ctx.stroke();
      ctx.restore();
    }
    // 血条
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(p.x - 12, p.y - 24, 24, 3.5);
    ctx.fillStyle = "#22c55e"; ctx.fillRect(p.x - 12, p.y - 24, 24 * (b.hp / b.maxHp), 3.5);
  }

  function drawFlameZone(ctx, o) {
    const p = w2s(o.x, o.z);
    const rw = o.r * view.scale * 0.42;
    const rh = o.r * view.scale * 0.22;
    ctx.save();
    ctx.fillStyle = "rgba(10, 5, 2, 0.55)";
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rw * 1.05, rh * 1.05, 0, 0, Math.PI * 2); ctx.fill();

    const grad = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, rw);
    grad.addColorStop(0, "rgba(254, 240, 138, 0.75)");
    grad.addColorStop(0.35, "rgba(249, 115, 22, 0.65)");
    grad.addColorStop(0.75, "rgba(185, 28, 28, 0.35)");
    grad.addColorStop(1, "rgba(153, 27, 27, 0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rw, rh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawSpriteUnit(ctx, asset, u, p) {
    const img = asset.img;
    const nw = img.naturalWidth, nh = img.naturalHeight;
    if (!nw || !nh) return false;

    let cols = 6, rows = 1;
    if (nw / nh > 2.8) {
      cols = nw > 1600 ? 8 : 6; rows = 1;
    } else if (nw / nh > 1.1) {
      cols = 6; rows = 5;
    } else {
      cols = 4; rows = 4;
    }

    const sw = nw / cols;
    const sh = nh / rows;

    let rIdx = 0;
    if (rows > 1) {
      if (u.action === "attack") rIdx = Math.min(2, rows - 1);
      else if (u.action === "walk") rIdx = Math.min(1, rows - 1);
      else rIdx = 0;
    }

    const frame = Math.floor(u.animTime) % cols;
    const sx = frame * sw;
    const sy = rIdx * sh;

    // 尺寸整体放大 1.6 倍，视觉清晰醒目
    const dw = 48 * (u.type === "brute" ? 1.3 : 1.0);
    const dh = dw * (sh / sw);

    ctx.drawImage(img, sx, sy, sw, sh, p.x - dw / 2, p.y - dh + 6, dw, dh);
    return true;
  }

  function draw() {
    ctx.save();
    if (S.shake > 0) {
      ctx.translate((Math.random() - 0.5) * 14 * S.shake, (Math.random() - 0.5) * 14 * S.shake);
    }
    ctx.clearRect(0, 0, view.w, view.h);

    // 1. 大地图
    if (ASSETS.bg.ready && ASSETS.bg.img.naturalWidth > 0) {
      ctx.drawImage(ASSETS.bg.img, 0, 0, view.w, view.h);
    }

    // 2. 烈焰
    for (const o of oils) drawFlameZone(ctx, o);

    // 3. 拟真木桩
    for (const b of blocks) drawBarricadeProp(ctx, b);

    // 4. 穿透箭（只在战场地面上平直射击）
    ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 2.4;
    for (const s of shots) {
      const a = w2s(s.ax, s.az), b = w2s(s.bx, s.bz);
      ctx.beginPath(); ctx.moveTo(a.x, a.y - 12); ctx.lineTo(b.x, b.y - 12); ctx.stroke();
    }

    // 5. 单位渲染
    const allUnits = [
      ...soldiers.map(u => ({ u, isSol: true })),
      ...enemies.map(u => ({ u, isSol: false }))
    ].sort((a, b) => a.u.z - b.u.z);

    for (const item of allUnits) {
      const u = item.u, p = w2s(u.x, u.z);
      const assetKey = item.isSol ? (u.type === "Guard" ? "guard" : "archer") : (u.type === "brute" ? "brute" : "grunt");
      const asset = ASSETS[assetKey];

      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath(); ctx.ellipse(p.x, p.y + 3, 12, 5, 0, 0, Math.PI * 2); ctx.fill();

      let ok = false;
      if (asset && asset.ready) ok = drawSpriteUnit(ctx, asset, u, p);
      if (!ok) {
        ctx.fillStyle = item.isSol ? "#2563eb" : "#dc2626";
        ctx.fillRect(p.x - 7, p.y - 22, 14, 20);
      }

      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(p.x - 10, p.y - 32, 20, 3.5);
      ctx.fillStyle = item.isSol ? "#38bdf8" : "#ef4444";
      ctx.fillRect(p.x - 10, p.y - 32, 20 * Math.max(0, u.hp / u.maxHp), 3.5);
    }

    // 6. 粒子与跳字
    for (const pt of particles) {
      const p = w2s(pt.x, pt.z);
      ctx.fillStyle = pt.color; ctx.fillRect(p.x, p.y - 8, 3, 3);
    }
    ctx.font = "900 12px Segoe UI"; ctx.textAlign = "center";
    for (const txt of texts) {
      const p = w2s(txt.x, txt.z);
      ctx.fillStyle = txt.color; ctx.fillText(txt.txt, p.x, p.y - 20);
    }

    ctx.restore();
  }

  let last = performance.now();
  function mainLoop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(mainLoop);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(mainLoop);
})();
</script>
</body>
</html>
